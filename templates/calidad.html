{% extends "base.html" %}

{% block content %}
<h2>Control de Calidad del Puré</h2>
<p>Usa la cámara para analizar si la yuca o el camote está en buenas condiciones para hacer el puré.</p>

<label>Seleccionar cámara:</label>
<select id="cameraSelect"></select>

<br><br>

<video id="video" width="300" height="250" autoplay></video>
<br>
<button id="snap">Tomar foto</button>

<canvas id="canvas" width="300" height="250" style="display:none;"></canvas>

<br><br>

<img id="captured" width="300">

<form method="POST">
    <input type="hidden" name="imagen" id="imagen">
    <button type="submit">Enviar al modelo</button>
</form>

{% if resultado %}
<h3>Resultado: {{ resultado }}</h3>
{% endif %}

<script src="{{ url_for('static', filename='js/camara.js') }}"></script>
{% endblock %}
