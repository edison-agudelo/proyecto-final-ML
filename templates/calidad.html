{% extends "base.html" %}
{% block content %}

<h2>Control de Calidad del Puré</h2>
<p>Usa la cámara para analizar si la yuca o el camote está en buenas condiciones para hacer el puré.</p>

<!-- Selector de cámara -->
<label for="listaCamaras">Seleccionar cámara:</label>
<select id="listaCamaras"></select>

<br><br>

<!-- Vista previa de cámara -->
<video id="video" width="320" height="240" autoplay style="border:2px solid #000;"></video>

<br><br>

<!-- Tomar foto -->
<button id="tomar" style="padding:8px 15px; background:#007bff; color:white;">Tomar foto</button>

<br><br>

<!-- Imagen capturada -->
<img id="foto" width="128" style="border:1px solid #444;">

<br><br>

<!-- Enviar al modelo -->
<button id="enviar" style="padding:8px 15px; background:#28a745; color:white;">Enviar al modelo</button>

<br><br>

<!-- Resultado -->
<div id="output" style="font-size:22px; font-weight:bold;"></div>

<!-- Archivo JS -->
<script src="{{ url_for('static', filename='js/camara.js') }}"></script>

{% endblock %}
