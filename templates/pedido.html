{% extends "base.html" %}
{% block content %}
<h2>Realizar Pedido</h2>

<form method="POST" id="pedidoForm">
    <label>Nombre del cliente:</label>
    <input type="text" name="nombre" placeholder="Tu nombre completo" required>

    <label>Correo electrónico:</label>
    <input type="email" name="email" placeholder="Tu correo electrónico" required>

    <label>Teléfono:</label>
    <input type="text" name="telefono" placeholder="Tu número de contacto" required>

    <label>Producto:</label>
    <select name="producto_id" id="productoSelect" required>
        <option value="">Seleccione un producto</option>
        {% for producto in productos %}
            <option value="{{ producto.id }}"
                    data-precio="{{ producto.precio }}"
                    data-nombre="{{ producto.nombre }}"
                    {% if producto.id == producto_seleccionado %}selected{% endif %}>
                {{ producto.nombre }} - ${{ producto.precio }}
            </option>
        {% endfor %}
    </select>

    <label>Precio unitario:</label>
    <input type="text" id="precio" readonly>

    <label>Cantidad:</label>
    <input type="number" name="cantidad" id="cantidad" min="1" value="1" required>

    <label>Total a pagar:</label>
    <input type="text" id="total" readonly>

    <button type="submit">Enviar pedido por WhatsApp</button>
</form>

<script>
    const productoSelect = document.getElementById('productoSelect');
    const cantidadInput = document.getElementById('cantidad');
    const precioInput = document.getElementById('precio');
    const totalInput = document.getElementById('total');

    function actualizarPrecioYTotal() {
        const opcion = productoSelect.options[productoSelect.selectedIndex];
        const precio = parseFloat(opcion.getAttribute('data-precio')) || 0;
        const cantidad = parseInt(cantidadInput.value) || 0;
        const total = precio * cantidad;

        precioInput.value = precio ? `$${precio.toFixed(2)}` : '';
        totalInput.value = total ? `$${total.toFixed(2)}` : '';
    }

    actualizarPrecioYTotal();
    productoSelect.addEventListener('change', actualizarPrecioYTotal);
    cantidadInput.addEventListener('input', actualizarPrecioYTotal);
</script>
{% endblock %}
