{% extends "base.html" %}
{% block content %}

<!-- ========================================================= -->
<!-- 🔐 FORMULARIO DE LOGIN - KAWSA VIVA -->
<!-- ========================================================= -->
<div class="login-container">
    
    <div class="login-card">
        <!-- Logo superior -->
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Kawsa Viva" class="login-logo">

        <h2 class="titulo-login">Iniciar Sesión</h2>
        <p class="subtitulo-login">Acceso exclusivo para administradores</p>

        <!-- Formulario -->
        <form method="POST" action="{{ url_for('login') }}">
            <input type="text" name="usuario" placeholder="Usuario" class="input-login" required>
            <input type="password" name="contrasena" placeholder="Contraseña" class="input-login" required>
            
            <button type="submit" class="btn-login">Ingresar</button>
        </form>

        <!-- Mensajes Flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="alert-container">
                    {% for category, message in messages %}
                        <div class="alert {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
    </div>
</div>

<!-- ========================================================= -->
<!-- 🌿 ESTILOS ESPECÍFICOS DEL LOGIN -->
<!-- ========================================================= -->
<style>
/* Fondo completo */
.login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 80vh;
    background: linear-gradient(180deg, #f9f7f3 0%, #e9e4db 100%);
}

/* Tarjeta principal */
.login-card {
    background-color: #ffffff;
    padding: 40px 50px;
    border-radius: 20px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
    text-align: center;
    width: 100%;
    max-width: 400px;
    transition: transform 0.3s ease;
}

.login-card:hover {
    transform: translateY(-5px);
}

/* Logo */
.login-logo {
    width: 90px;
    height: 90px;
    object-fit: contain;
    margin-bottom: 15px;
}

/* Título */
.titulo-login {
    color: #004b23;
    font-size: 1.8rem;
    margin-bottom: 5px;
}

/* Subtítulo */
.subtitulo-login {
    color: #777;
    font-size: 0.95rem;
    margin-bottom: 25px;
}

/* Inputs */
.input-login {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 1rem;
    transition: all 0.3s ease;
}

.input-login:focus {
    border-color: #004b23;
    box-shadow: 0 0 6px rgba(0, 75, 35, 0.25);
}

/* Botón */
.btn-login {
    width: 100%;
    background-color: #004b23;
    color: #fff;
    border: none;
    padding: 12px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.3s ease;
}

.btn-login:hover {
    background-color: #1f6f43;
}

/* Alertas */
.alert-container {
    margin-top: 20px;
}

.alert {
    padding: 10px 20px;
    border-radius: 8px;
    margin-bottom: 10px;
    display: inline-block;
    text-align: center;
}

.alert.success { background: #d4edda; color: #155724; }
.alert.danger  { background: #f8d7da; color: #721c24; }

/* Responsive */
@media (max-width: 600px) {
    .login-card {
        padding: 30px;
        width: 90%;
    }

    .titulo-login {
        font-size: 1.5rem;
    }
}
</style>

{% endblock %}
